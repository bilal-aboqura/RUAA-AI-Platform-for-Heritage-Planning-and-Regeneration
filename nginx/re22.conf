##############################################################################
# re22 — Nginx site configuration
#
# Location on VPS: /etc/nginx/sites-available/re22
# Enable with:     sudo ln -s /etc/nginx/sites-available/re22 /etc/nginx/sites-enabled/
#                  sudo nginx -t && sudo systemctl reload nginx
##############################################################################

# Redirect bare HTTP → HTTPS (activate after Certbot SSL is in place)
server {
    listen 80;
    server_name ruaa-ai.cloud www.ruaa-ai.cloud;
    return 301 https://$host$request_uri;
}

server {
    # listen 80;                     # now handled by the redirect block above
    listen 443 ssl http2;

    server_name ruaa-ai.cloud www.ruaa-ai.cloud;

    # ── SSL (filled in automatically by Certbot) ──────────────────────────
    # ssl_certificate     /etc/letsencrypt/live/ruaa-ai.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ruaa-ai.cloud/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Upload size (must be >= the multer limit in your routes: 100 MB) ──
    client_max_body_size 110m;

    # ── Real-IP passthrough ───────────────────────────────────────────────
    proxy_set_header  Host              $host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;

    # ── Timeouts (generous for long-running AI jobs) ──────────────────────
    proxy_read_timeout    300s;
    proxy_connect_timeout  30s;
    proxy_send_timeout    300s;

    # ── Proxy to the Docker container ─────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;

        # WebSocket support (if ever needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Static file caching for long-lived assets ─────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;
}
